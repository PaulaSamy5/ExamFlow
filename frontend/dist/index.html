<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamFlow | Professional Exam Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://unpkg.com/mathlive"></script>
    <script>
      // Apply theme before DOM parsed to prevent white flashes on refresh
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CjU5kRGV.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Ck-ne0re.css">
  </head>
  <body>
    <div id="root">
      <div id="initial-loader-screen">
        <style>
          :root {
            --bg-color: #f8fafc;
            --text-color: #0f172a;
            --primary: #4f46e5;
          }
          html.dark {
            --bg-color: #040814;
            --text-color: #f8fafc;
            --primary: #818cf8;
          }
          #initial-loader-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            z-index: 99999;
            font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
          }
          .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
          }
          .logo-wrapper {
            position: relative;
            animation: initial-pulse 2s infinite ease-in-out;
          }
          .logo-box {
            background-color: #4f46e5;
            padding: 0.75rem;
            border-radius: 1.25rem;
            box-shadow: 0 12px 30px -4px rgba(79, 70, 229, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
          }
          .logo-icon {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.25;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .loader-title {
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: -0.25rem;
          }
          html.dark .loader-title {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
          }
          .spinner-bar {
            width: 130px;
            height: 3px;
            background-color: rgba(79, 70, 229, 0.1);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
          }
          html.dark .spinner-bar {
            background-color: rgba(129, 140, 248, 0.1);
          }
          .spinner-progress {
            position: absolute;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border-radius: 9999px;
            animation: initial-progress-loop 1.2s infinite ease-in-out;
            transform-origin: left;
          }
          html.dark .spinner-progress {
            background: linear-gradient(90deg, #818cf8, #c084fc);
          }
          @keyframes initial-pulse {
            0%, 100% { transform: scale(1); opacity: 0.95; }
            50% { transform: scale(1.05); opacity: 1; }
          }
          @keyframes initial-progress-loop {
            0% { left: -50%; }
            100% { left: 100%; }
          }
        </style>
        <div class="loader-container">
          <div class="logo-wrapper">
            <div class="logo-box">
              <svg class="logo-icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
            </div>
          </div>
          <div class="loader-title">ExamFlow</div>
          <div class="spinner-bar">
            <div class="spinner-progress"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
